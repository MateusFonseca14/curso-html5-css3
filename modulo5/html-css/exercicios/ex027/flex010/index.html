<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
            flex-shrink: 1;
            flex-grow: 1;
        }
        /*
    📌 flex-grow

            Controla quanto o item pode crescer para ocupar o espaço livre no container.

            Valor padrão: 0 → não cresce além do tamanho inicial (flex-basis ou conteúdo).

    📌 flex-shrink

            Controla quanto o item pode encolher quando falta espaço no container.

            Valor padrão: 1 → pode encolher proporcionalmente.

        ⚡ Resumindo em uma linha:

            flex-grow → cresce quando sobra espaço.

            flex-shrink → encolhe quando falta espaço.
        */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
