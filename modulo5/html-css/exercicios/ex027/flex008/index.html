<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 400px;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

        div#i1 {
            
        }

        div#i2 {
            align-self: auto;/* ou inherit = herdado */
        }

        div#i3 {
            align-self: flex-end;
        }

        div#i4 {
            
        }

        div#i5 {
            align-self: center;
        }

        div#i6 {
           align-self: flex-start;
        }

        div#i7 {
            align-self: stretch;
        }
        /*
    📌 align-self

            Permite sobrescrever o align-items de um item individual.

            Alinha um único item no eixo transversal (cross axis) dentro do container flex.

        Valores comuns:

            auto → usa o valor de align-items do container (padrão)

            flex-start → encosta no início do cross axis

            flex-end → encosta no fim do cross axis

            center → centraliza no cross axis

            stretch → estica o item para preencher o cross axis

            baseline → alinha pela linha de base do conteúdo

        💡 Resumo rápido:

            align-items → controla todos os itens juntos (para todos os itens do container)

            align-self → controla um item específico (para um item individual)

            Permite criar layoutes variados, como imagens ou cards em alturas diferentes, mesmo dentro de um único container.
        */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
