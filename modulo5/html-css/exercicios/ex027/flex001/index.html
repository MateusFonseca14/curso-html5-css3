<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
        }

        /*
    Propriedades mais usadas com display: flex;
    
Propriedades do Container (afetam o layout dos itens dentro)

        flex-direction → Define a direção dos itens

            row (padrão) → em linha, da esquerda p/ direita.

            row-reverse → a ordem muda para da direita para a esquerda.

            column → em coluna, de cima p/ baixo.

            column-reverse → a ordem fica de baixo para cima.

        justify-content → Alinha os itens no eixo principal.(Main axis)

            flex-start, flex-end, center, space-between, space-around, space-evenly

            Valores mais comuns de justify-content

            flex-start (padrão) → itens encostados no início do eixo principal

            flex-end → itens encostados no final do eixo principal

            center → itens centralizados

            space-between → espaço igual entre os itens

            space-around → espaço igual em torno dos itens

            space-evenly → espaço igual entre e ao redor dos itens

        align-items → Alinha os itens no eixo cruzado.(Cross axis)

            flex-start, flex-end, center, stretch, baseline

            Valores comuns:

            stretch (padrão) → itens preenchem todo o espaço disponível no eixo transversal (altura ou largura, dependendo do eixo) stretch = estica os itens no cross axis (eixo transversal)

            flex-start → itens encostam no início do eixo transversal

            flex-end → itens encostam no fim do eixo transversal

            center → itens centralizados no eixo transversal

            baseline → itens alinhados pelas suas linhas de base do texto

    📌 align-content
        Alinha todas as linhas de itens dentro do container no eixo transversal (cross axis).

            Só funciona quando o container tem múltiplas linhas (flex-wrap: wrap ou wrap-reverse).

            Não afeta itens individuais dentro de uma linha — para isso usamos align-items.

        Valores comuns

            stretch (padrão) → linhas se esticam para preencher o container

            flex-start → linhas encostam no início do eixo transversal

            flex-end → linhas encostam no final do eixo transversal

            center → linhas centralizadas

            space-between → distribui o espaço entre as linhas

            space-evenly → espaço igual entre as linhas e nas extremidades

            space-around → distribui o espaço em torno das linhas

        💡 Resumo rápido:

            align-content = controla todas as linhas no eixo transversal

            align-items = controla itens individuais no eixo transversal

        flex-wrap → Define se os itens podem quebrar linha.

            nowrap (padrão), wrap, wrap-reverse

            nowrap → tudo fica em uma única linha, podendo “vazar” do container.

            wrap → itens vão para a linha seguinte quando não cabem.

            wrap-reverse → segunda linha vai acima da primeira.

        ⚡ Resumo rápido

            Wrap segue o eixo transversal → nunca “mistura” sentido principal com transversal.

            O wrap-reverse só inverte a direção do cross axis: linhas aparecem “acima” ou colunas aparecem “à esquerda”.

Propriedades dos Itens (afetam cada item individual)

    📌 flex: initial 

            É um atalho para:

            (padrão) flex: 0 1 auto; 

        Explicando cada parte do padrão:

            flex-grow: 0 → o item não cresce além do seu tamanho inicial.

            flex-shrink: 1 → o item pode encolher se faltar espaço.

            flex-basis: auto → o tamanho inicial é baseado no conteúdo ou no width/height definido.
        
        💡 Resumo:

            flex: initial = padrão do Flexbox = 0 1 auto

            Se você não escrever nada, o item já se comporta assim por padrão.

        flex: none

            É um atalho para:

            flex: 0 0 auto

            flex-grow: 0 → o item não cresce, mesmo se houver espaço sobrando no container.

            flex-shrink: 0 → o item não encolhe, mesmo que falte espaço.

            flex-basis: auto → o tamanho inicial é baseado no conteúdo ou no width/height definido.

        💡 Resumo:

            O item fica fixo no seu tamanho natural, não cresce nem encolhe.

            É útil quando você quer proteger o tamanho de um item, independentemente do espaço do container.

        flex: auto 

            É um atalho para:

            flex: 1 1 auto;


        Que significa:

            flex-grow: 1 → o item pode crescer para ocupar o espaço livre.

            flex-shrink: 1 → o item pode encolher se faltar espaço.

            flex-basis: auto → o tamanho inicial é baseado no conteúdo ou em um valor definido de width/height.

        ⚡ Em resumo:

            display: flex → cria o sistema de alinhamento.

            flex: auto → faz os itens dentro desse sistema crescerem/encolherem de forma equilibrada.

        flex: <positive-number> (pode ser qualquer número o 3 é só exemplo)

            Atalho para:

            flex: 3 1 0

        Explicação de cada parte

            flex-grow: <número> → define quanto o item vai crescer em relação aos outros itens dentro do container.

            flex-shrink: 1 → o item pode encolher se faltar espaço, padrão do atalho.

            flex-basis: 0 → o tamanho inicial é 0, então o crescimento depende totalmente do flex-grow.

        💡 Resumo

            flex: <positive-number> é um atalho rápido para definir apenas o crescimento proporcional.

            Não define flex-basis baseado no conteúdo (começa do 0).

            Não muda o shrink (sempre 1 no atalho).
        */

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
