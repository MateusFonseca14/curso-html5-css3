<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
           
        }

        div#cxA {
        /*  flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px;  */

            flex: 1 0 200px;
        }

        div#cxB {
        /*  flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 150px;  */

            flex: 1 1 150px;
        }

        div#cxC {
        /*  flex-shrink: 8;
            flex-grow: 1;
            flex-basis: auto;  */

            flex: 1 8 auto;
        }
        /*
📌 flex

        É um atalho (shorthand) para definir 3 propriedades do Flexbox de uma vez:

        flex-grow → quanto o item cresce se sobra espaço

        flex-shrink → quanto o item encolhe se falta espaço

        flex-basis → tamanho inicial do item

    Exemplo; flex-basis: 150px
             flex-grow: 0
             flex-shrink: 1 

        vai ficar = flex: 0 1 150px nessa ordem.

    💡 Resumo rápido:

        Ordem importa: grow → shrink → basis

        Serve para escrever tudo em uma linha, deixando o código mais limpo.
        */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
