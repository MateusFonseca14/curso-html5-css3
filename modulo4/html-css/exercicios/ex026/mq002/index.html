<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <link rel="stylesheet" href="estilos/retrato.css" media="screen and (orientation: portrait)">
    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation: landscape)">
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>

</body>
</html>
<!-- 
media="screen"

Indica que o CSS deve ser aplicado somente em telas (computadores, tablets, celulares).
Ignora impressoras ou leitores de tela.

and

Combina o Media Type com uma Media Feature.
Ou seja, só aplica o CSS se tanto o tipo quanto a condição forem verdadeiros.

(orientation: portrait)

Media Feature que verifica se a tela está em retrato (altura maior que largura).
Quando verdadeiro, o CSS de retrato.css é aplicado.

(orientation: landscape)

Media Feature que verifica se a tela está em paisagem (largura maior que altura).
Quando verdadeiro, o CSS de paisagem.css é aplicado. -->
